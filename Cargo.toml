[workspace]
edition = "2024"
resolver = "3"
members = [
    "crates/app",
    "crates/tic-parser",
]

exclude = ["build"]

[workspace.dependencies]
tic-parser = { path = "crates/tic-parser" }

ariel-os = { path = "build/imports/ariel-os/src/ariel-os" }
ariel-os-boards = { path = "build/imports/ariel-os/src/ariel-os-boards" }

esp-hal = { version = "~1.0", default-features = false }
esp-hal-smartled = { git = "https://github.com/kaspar030/esp-hal-community", rev = "1f88d903653b418e3b478810a8150f851b0e217c", default-features = false }
smart-leds = "0.4.0"
embassy-time = { version = "0.5.1", default-features = false }
embedded-io-async = { version = "0.6.1", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
defmt = "1.1.1"

der = { version = "0.8", default-features = false }

reqwless = { version = "0.14.0", default-features = true }
embassy-sync = "0.7.2"
rand_core = "0.9.3"
serde = { version = "1.0.229", default-features = false }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(context, values(any()))',
] }
