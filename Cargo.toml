[workspace]
resolver = "3"
members = [
    "firmware",
    "winky-board",
]
exclude = ["build"]


[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]

ariel-os-embassy-common = { path = "build/imports/ariel-os/src/ariel-os-embassy-common" }
ariel-os-hal = { path = "build/imports/ariel-os/src/ariel-os-hal" }
winky-board = { path = "winky-board" }
