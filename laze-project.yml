imports:
  - git:
      url: https://github.com/nponsard/ariel-os
      branch: patch/winky
    dldir: ariel-os

apps:
  - name: winky-ariel
    context:
      - espressif-esp32-c6-devkitc-1
    env:
      global:
        executor_stacksize_required:
          - "65536"
    selects:
      - network
      - random
      - alloc
